// Root build.gradle — shared config for all submodules
plugins {
    id 'java'
}

allprojects {
    group = 'com.weathermon'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    // Shared dependency versions
    ext {
        kafkaVersion = '3.7.0'
        jacksonVersion = '2.17.0'
        slf4jVersion = '2.0.13'
    }
}
