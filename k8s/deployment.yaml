# ═══════════════════════════════════════════════════════════════
# Weather Monitoring System — Kubernetes Deployment
# ═══════════════════════════════════════════════════════════════
#
# Deploy: kubectl apply -f k8s/deployment.yaml
# Check:  kubectl get pods
# Logs:   kubectl logs -f deployment/central-station
#
# Prerequisites:
#   docker build -t weather-station:latest -f weather-station/Dockerfile .
#   docker build -t central-station:latest -f central-station/Dockerfile .
#   docker build -t rain-processor:latest -f rain-processor/Dockerfile .

---
# ─── Namespace ────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: weather-monitoring

---
# ─── ZooKeeper ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: weather-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: bitnamilegacy/zookeeper:3.8
          ports:
            - containerPort: 2181
          env:
            - name: ALLOW_ANONYMOUS_LOGIN
              value: "yes"

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: weather-monitoring
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181

---
# ─── Kafka Broker ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: weather-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: bitnamilegacy/kafka:3.4
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_CFG_ZOOKEEPER_CONNECT
              value: "zookeeper-service:2181"
            - name: KAFKA_CFG_LISTENERS
              value: "PLAINTEXT://:9092"
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-service:9092"
            - name: ALLOW_PLAINTEXT_LISTENER
              value: "yes"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: weather-monitoring
spec:
  selector:
    app: kafka
  ports:
    - port: 9092
      targetPort: 9092

---
# ─── Weather Stations (10 replicas, each with unique ID) ─────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-station-1
  namespace: weather-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-station
      station-id: "1"
  template:
    metadata:
      labels:
        app: weather-station
        station-id: "1"
    spec:
      containers:
        - name: weather-station
          image: weather-station:latest
          imagePullPolicy: Never
          env:
            - name: STATION_ID
              value: "1"
            - name: KAFKA_BOOTSTRAP
              value: "kafka-service:9092"

