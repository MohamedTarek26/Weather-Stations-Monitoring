---
# ─── Rain Processor ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rain-processor
  namespace: weather-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rain-processor
  template:
    metadata:
      labels:
        app: rain-processor
    spec:
      containers:
        - name: rain-processor
          image: rain-processor:latest
          imagePullPolicy: Never
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka-service:9092"

---
# ─── Open-Meteo Channel Adapter (Bonus) ─────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-meteo-adapter
  namespace: weather-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-meteo-adapter
  template:
    metadata:
      labels:
        app: open-meteo-adapter
    spec:
      containers:
        - name: open-meteo-adapter
          image: weather-station:latest
          imagePullPolicy: Never
          command: ["java", "-cp", "app.jar", "com.weathermon.station.OpenMeteoAdapter"]
          env:
            - name: STATION_ID
              value: "99"
            - name: KAFKA_BOOTSTRAP
              value: "kafka-service:9092"
            - name: TOPIC
              value: "weather-status"
            - name: LATITUDE
              value: "30.06"
            - name: LONGITUDE
              value: "31.25"
            - name: POLL_INTERVAL
              value: "30"

---
# ─── Central Station ─────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: central-station
  namespace: weather-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: central-station
  template:
    metadata:
      labels:
        app: central-station
    spec:
      containers:
        - name: central-station
          image: central-station:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka-service:9092"
            - name: BITCASK_DIR
              value: "/app/data/bitcask"
            - name: ARCHIVE_DIR
              value: "/app/data/archive"
            - name: API_PORT
              value: "8080"
            - name: ES_HOST
              value: "elasticsearch-service:9200"
          volumeMounts:
            - name: central-data
              mountPath: /app/data
      volumes:
        - name: central-data
          persistentVolumeClaim:
            claimName: shared-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: central-station-service
  namespace: weather-monitoring
spec:
  type: NodePort
  selector:
    app: central-station
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080

---
# ─── Shared Storage for Parquet files + BitCask data ─────────
# This PVC is the shared storage required by the project.
# Central Station writes Parquet archives + BitCask segments here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-data-pvc
  namespace: weather-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# ─── ElasticSearch ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: weather-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: "single-node"
            - name: xpack.security.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-data
          persistentVolumeClaim:
            claimName: elasticsearch-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: weather-monitoring
spec:
  type: NodePort
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
      nodePort: 30920

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: elasticsearch-pvc
  namespace: weather-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# ─── Kibana ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
